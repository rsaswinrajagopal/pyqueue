services:
  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYQUEUE_REDIS_HOST: redis
    deploy:
      replicas: 2
    stop_grace_period: 15s
